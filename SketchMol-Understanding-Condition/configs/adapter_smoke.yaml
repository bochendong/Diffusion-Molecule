model:
  mllm_hidden_dim: 3584
  context_dim: 256
  num_queries: 32
  hidden_dim: 1024
  dropout: 0.0

data:
  source_image_column: source_image
  source_smiles_column: source_smiles
  target_image_column: target_image
  target_smiles_column: target_smiles
  instruction_column: instruction

training:
  mode: adapter_only
  freeze_mllm: true
  freeze_sketchmol_unet: true
  batch_size: 8
  learning_rate: 0.0001
  max_steps: 1000

evaluation:
  baselines:
    - sketchmol_original_condition
    - text_only_mllm_condition
    - image_only_mllm_condition
    - random_query_tokens
    - caption_bottleneck
  metrics:
    - validity
    - scaffold_preservation
    - source_generated_similarity
    - property_success
